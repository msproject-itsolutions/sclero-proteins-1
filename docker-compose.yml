# Shared-VPS production stack.
#
# Only the application edge is published, and only on loopback. The VPS's
# existing host nginx owns ports 80/443 and proxies each Sclero hostname to
# 127.0.0.1:${SCLERO_HTTP_PORT:-18088}. All service and volume names are scoped
# by COMPOSE_PROJECT_NAME, preventing collisions with other Compose projects.

name: ${COMPOSE_PROJECT_NAME:-sclero-proteins}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sclero_db}
      POSTGRES_USER: ${POSTGRES_USER:-sclero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sclero} -d ${POSTGRES_DB:-sclero_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    mem_limit: ${DB_MEMORY_LIMIT:-768m}
    cpus: ${DB_CPUS:-1.0}
    pids_limit: 200
    logging: *default-logging
    networks:
      - database
    <<: *default-security

  backend:
    image: sclero-proteins-backend:${APP_IMAGE_TAG:-local}
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      ALLOW_SQLITE_FALLBACK: "False"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready/', timeout=5)"
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 60s
    stop_grace_period: 45s
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    cpus: ${BACKEND_CPUS:-1.0}
    pids_limit: 256
    logging: *default-logging
    networks:
      - database
      - application
    <<: *default-security

  frontend:
    image: sclero-proteins-frontend:${APP_IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        # Empty by design: browsers call same-origin /api through the edge.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_TIKTOK_PIXEL_ID: ${NEXT_PUBLIC_TIKTOK_PIXEL_ID:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_COMPANY_REGISTRATION_NUMBER: ${COMPANY_REGISTRATION_NUMBER:-}
        NEXT_PUBLIC_IN_GSTIN: ${IN_GSTIN:-}
        NEXT_PUBLIC_TRUSTPILOT_BUSINESS_UNIT_ID: ${NEXT_PUBLIC_TRUSTPILOT_BUSINESS_UNIT_ID:-}
    restart: unless-stopped
    init: true
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 45s
    stop_grace_period: 30s
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-768m}
    cpus: ${FRONTEND_CPUS:-1.0}
    pids_limit: 256
    logging: *default-logging
    networks:
      - application
    <<: *default-security

  edge:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SCLERO_HTTP_PORT:-18088}:8080"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - media:/var/www/media:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header='Host: scleroproteins.co.uk' -O /dev/null http://127.0.0.1:8080/api/health/live/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 20s
    mem_limit: ${EDGE_MEMORY_LIMIT:-128m}
    cpus: ${EDGE_CPUS:-0.25}
    pids_limit: 100
    logging: *default-logging
    networks:
      - application
    <<: *default-security

volumes:
  pgdata:
  media:

networks:
  application:
  database:
    internal: true
