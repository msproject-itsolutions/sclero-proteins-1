name: Production checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sclero_ci
          POSTGRES_USER: sclero
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sclero -d sclero_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-secret-key-not-for-production
      # Tests run on PostgreSQL, the production database. SQLite does not
      # enforce row locks or column lengths, so it must never be used here.
      ALLOW_SQLITE_FALLBACK: "False"
      DB_NAME: sclero_ci
      DB_USER: sclero
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install ruff==0.15.22 pip-audit==2.10.1 bandit==1.9.4
      - run: python -m ruff check .
      - run: python -m pip_audit -r requirements.txt
      - run: python -m bandit -r apps sclero_backend -q -ll
      - run: python manage.py check
      - run: python manage.py audit_rbac --strict
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose requires the env_file to exist; validate against the template.
      - run: cp .env.production.example .env
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://example.test
