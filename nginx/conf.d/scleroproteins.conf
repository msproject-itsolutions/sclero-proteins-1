# Internal application edge. TLS and public ports are owned by the shared VPS
# host nginx; this server is reachable only through the loopback-published
# Compose port.

upstream sclero_backend {
    server backend:8000;
    keepalive 16;
}

upstream sclero_frontend {
    server frontend:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' http;
}

server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name scleroproteins.co.uk www.scleroproteins.co.uk
                scleroproteins.in www.scleroproteins.in
                scleroproteins.com www.scleroproteins.com;

    server_tokens off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://sclero_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        # The host nginx replaces any client-supplied forwarding chain with the
        # validated client address. Preserve that exact value here.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition "inline";
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://sclero_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
