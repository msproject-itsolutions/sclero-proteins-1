# All three domains share one upstream routing scheme: the Next.js middleware
# handles the geo / .com redirects, so nginx just proxies. /api, /admin, /static
# and /media go to Django; everything else goes to Next.js.

upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- HTTP :80 — ACME challenge + redirect everything else to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name scleroproteins.co.uk www.scleroproteins.co.uk
                scleroproteins.in    www.scleroproteins.in
                scleroproteins.com   www.scleroproteins.com;

    # Let's Encrypt webroot challenge — must be served over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS :443 — the real site (covers all six names via one SAN cert) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scleroproteins.co.uk www.scleroproteins.co.uk
                scleroproteins.in    www.scleroproteins.in
                scleroproteins.com   www.scleroproteins.com;

    # One SAN certificate issued under the .co.uk lineage (see init-letsencrypt.sh).
    ssl_certificate     /etc/letsencrypt/live/scleroproteins.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scleroproteins.co.uk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Allow large-ish uploads (product images via admin).
    client_max_body_size 25m;

    # Security headers (HSTS is also set by Django; harmless to repeat here).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Django: API + admin + its own static ---
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass the edge country header through so Django-side geo also works.
        proxy_set_header CF-IPCountry      $http_cf_ipcountry;
    }

    # --- User-uploaded media, served straight from the shared volume ---
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Everything else: Next.js (storefront + middleware redirects) ---
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward the country header to the Next.js middleware (geo redirect).
        proxy_set_header CF-IPCountry      $http_cf_ipcountry;
    }
}
