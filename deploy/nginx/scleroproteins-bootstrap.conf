# Temporary HTTP-only host config used solely to issue the first certificate.
# Replace it with scleroproteins-host.conf after certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name scleroproteins.co.uk www.scleroproteins.co.uk
                scleroproteins.in www.scleroproteins.in
                scleroproteins.com www.scleroproteins.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 503;
    }
}
