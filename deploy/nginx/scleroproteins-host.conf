# Install as /etc/nginx/sites-available/scleroproteins.conf on the VPS host.
# The existing host nginx owns public ports and TLS; the application stack is
# available only at the loopback upstream below.

upstream sclero_app {
    server 127.0.0.1:18088;
    keepalive 32;
}

map $http_upgrade $sclero_connection_upgrade {
    default upgrade;
    '' close;
}

# NOTE: /api/auth/ used to have its own location with a dedicated limit_req zone
# and `include /etc/nginx/proxy_params;` on top of explicit proxy_set_header Host.
# That include emits `Host $http_host` while the block also set `Host $host`,
# producing TWO Host headers on the proxied request. Per RFC 7230 a request with
# multiple Host headers is invalid and the upstream returned a bare 400 with no
# error-log entry — silent, per spec. The rate limit is now enforced by DRF at
# apps/users/views.py (throttle_scope = 'auth'), so the nginx-level throttle
# and the separate /api/auth/ location have been removed here.

server {
    listen 80;
    listen [::]:80;
    server_name scleroproteins.co.uk www.scleroproteins.co.uk
                scleroproteins.in www.scleroproteins.in
                scleroproteins.com www.scleroproteins.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scleroproteins.co.uk www.scleroproteins.co.uk
                scleroproteins.in www.scleroproteins.in
                scleroproteins.com www.scleroproteins.com;

    # Certbot updates these files in place. Issue one SAN certificate containing
    # every server_name before enabling this server block.
    ssl_certificate /etc/letsencrypt/live/scleroproteins.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scleroproteins.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SCLERO_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    # Start with one hour. Increase only after every hostname is confirmed over
    # HTTPS. Do not add includeSubDomains/preload casually on a shared estate.
    add_header Strict-Transport-Security "max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

    location / {
        proxy_pass http://sclero_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sclero_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_read_timeout 90s;
    }
}
